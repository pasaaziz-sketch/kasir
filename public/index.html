<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasir &amp; Stok</title>
<meta name="description" content="Aplikasi kasir dan stok toko">
<meta name="theme-color" content="#1D5BD6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
code{font-family:var(--f-mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:4px}
/* Layout: two-pane point-of-sale counter (catalog | struk-style cart), tabs for stock and sales history */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D5DBD3;
  --ink:#16201B; --muted:#5C6A62; --accent:#1D5BD6; --accent-ink:#FFFFFF; --accent-soft:#E2EAFB;
  --ok:#1E7A4C; --ok-soft:#DDF0E5; --warn:#A35D00; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FADCD8;
  --paper:#FFFEF8; --ph-l:87%; --ph-t:32%;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#171E1A; --sunk:#1E2721; --line:#2C3830;
  --ink:#E7EDE9; --muted:#97A59C; --accent:#6F98FF; --accent-ink:#0B1222; --accent-soft:#1D2A47;
  --ok:#5FD39A; --ok-soft:#173527; --warn:#F2B35A; --warn-soft:#3A2A12; --bad:#FF8A7E; --bad-soft:#3D1A17;
  --paper:#1B221E; --ph-l:24%; --ph-t:80%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171E1A; --sunk:#1E2721; --line:#2C3830;
  --ink:#E7EDE9; --muted:#97A59C; --accent:#6F98FF; --accent-ink:#0B1222; --accent-soft:#1D2A47;
  --ok:#5FD39A; --ok-soft:#173527; --warn:#F2B35A; --warn-soft:#3A2A12; --bad:#FF8A7E; --bad-soft:#3D1A17;
  --paper:#1B221E; --ph-l:24%; --ph-t:80%; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 12px;border-bottom:1px solid var(--line);max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.brand h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.storebtn{background:none;border:0;padding:2px 6px;border-radius:6px;color:var(--muted);cursor:pointer;font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.storebtn:hover{background:var(--sunk);color:var(--ink)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;white-space:nowrap}
nav.tabs button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mode{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.mode.db i{background:var(--ok)} .mode.local i{background:var(--warn)}

main{max-width:1280px;margin:0 auto;padding-block:18px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* Kasir */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 240px;position:relative}
.search .input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prod{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;transition:border-color .12s,transform .12s}
.prod:hover:not(:disabled){border-color:var(--accent)}
.prod:active:not(:disabled){transform:scale(.98)}
.prod:disabled{opacity:.5;cursor:not-allowed}
.prod .cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.prod .nm{font-weight:600;line-height:1.25;flex:1;overflow-wrap:anywhere}
.prod .pr .per{font-weight:400;color:var(--muted);font-size:12px}
.prod .pr{font-family:var(--f-mono);font-weight:600;font-size:14px}
.prod .incart{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.prod{padding:0;gap:0;overflow:hidden;min-height:0}
.prod .pimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sunk)}
.prod:disabled .pimg{filter:grayscale(1)}
.pbody{display:flex;flex-direction:column;gap:5px;padding:10px 12px 12px;flex:1;min-width:0}
.prod .incart{z-index:1;box-shadow:0 0 0 2px var(--surface)}
.ph{display:grid;place-items:center;font-family:var(--f-display);font-weight:700;letter-spacing:.02em;background:hsl(var(--h) 42% var(--ph-l));color:hsl(var(--h) 45% var(--ph-t));font-size:30px;user-select:none}
.pcell{display:flex;align-items:center;gap:10px;min-width:0}
.tthumb{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:none;font-size:15px}
.fprev{width:96px;height:96px;border-radius:10px;object-fit:cover;display:grid;font-size:30px;border:1px solid var(--line)}
.photo-edit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0;flex:1}
.photo-btns .row2{display:flex;gap:6px;flex-wrap:wrap}
.daterow{align-items:flex-end}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ucard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ucard.off{opacity:.6}
.ucb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ucb .un{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.note{margin-top:18px;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;max-width:70ch}
.note ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
[hidden]{display:none!important}
.role-kasir .adm{display:none!important}
.role-kasir .tiles.six{grid-template-columns:repeat(2,minmax(0,1fr))}
.who{display:flex;align-items:center;gap:6px}
.prbtn{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.prbtn i{position:absolute;right:1px;top:1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface);display:none}
.prbtn[data-st="ok"] i{display:block;background:var(--ok)}
.prbtn[data-st="off"] i,.prbtn[data-st="none"] i{display:block;background:var(--warn)}
.pmodes{display:flex;flex-direction:column;gap:8px}
.pmode{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.field label.pmode{text-transform:none;letter-spacing:0;font-size:14px;font-weight:400;color:var(--ink)}
.pmode b{font-weight:700}
.pmode.on{border-color:var(--accent);background:var(--accent-soft)}
.pmode input{margin-top:3px;accent-color:var(--accent)}
.pmode>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.prstat{display:flex;align-items:center;gap:8px;font-size:14px}
.prstat i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.prstat.ok i{background:var(--ok)}.prstat.off i{background:var(--warn)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.userchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;font-weight:600;font-size:14px;max-width:220px}
.userchip span:not(.avatar){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userchip .r{font-size:11px;color:var(--muted);font-weight:600;flex:none}
.avatar{width:48px;height:48px;border-radius:50%;font-size:17px;flex:none}
.userchip .avatar{width:28px;height:28px;font-size:11px}
.avatar.big{width:56px;height:56px;font-size:20px}
.ufilter{width:auto;padding:6px 10px;font-size:14px}
.login{max-width:440px;margin:28px auto;display:flex;flex-direction:column;gap:16px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.lcard h2{font-family:var(--f-display);font-size:26px;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ubtn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.ubtn:hover{border-color:var(--accent)}
.ubtn .un{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubtn .role{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pinwho{display:flex;align-items:center;gap:12px}
.pinwho .pn{font-family:var(--f-display);font-size:22px;font-weight:700}
.pinwho h3{margin:0}
.dots{display:flex;gap:14px;justify-content:center;padding:8px 0 0}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted);transition:background .1s}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:shake .32s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}}
.lerr{color:var(--bad);text-align:center;font-weight:600;min-height:1.4em;margin:0;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:24px;font-weight:600;font-family:var(--f-mono);cursor:pointer;color:var(--ink)}
.pad button:active:not(:disabled){background:var(--sunk)}
.pad button:disabled{opacity:.4}
.pad .fn{font-family:var(--f-body);font-size:15px}
.pad .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.urow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow .avatar{width:40px;height:40px;font-size:14px}
.kas{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:760px){.kas{grid-template-columns:minmax(0,1fr)}}
.kas-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kas-side{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kh{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:14px 0 4px}
.kas-card .kh:first-child{margin-top:0}
.kl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0}
.kl>span:first-child{min-width:0;overflow-wrap:anywhere}
.kl .mono{white-space:nowrap}
.kl.sub{color:var(--muted);font-size:14px;padding-left:14px}
.kl.b{font-weight:700}
.kl.grand{font-family:var(--f-display);font-size:20px;font-weight:700}
.kl.grand .mono{font-size:19px}
.kl.neg .mono{color:var(--bad)}
.kdiv{border-top:1px dashed var(--line);margin:10px 0}
.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:700px){.tiles.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile.neg .v{color:var(--bad)}
h3.sub{font-family:var(--f-display);font-size:17px;margin:18px 0 10px}
.catbars{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.catbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:12px;align-items:center}
.catbar .cn{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.share.wide{width:100%;height:8px;margin:0}
.badge.stock{background:var(--accent-soft);color:var(--accent)}
.bline{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--bg)}
.bnums{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end}
.bsub{padding-bottom:10px;white-space:nowrap;font-weight:600}
@media (max-width:480px){.bnums{grid-template-columns:1fr 1fr}nav.tabs button{padding:7px 10px;font-size:14px}}
table.mini{min-width:0;font-size:13px}
table.mini th,table.mini td{padding:6px 8px}
.daterow .field{flex:0 1 170px}
.seg{display:inline-flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{white-space:nowrap;flex:none}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.share{height:6px;width:70px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:3px}
.share span{display:block;height:100%;background:var(--accent);border-radius:3px}
table.recap{min-width:860px}
tfoot td{font-weight:700;background:var(--sunk);border-bottom:0}
.stk{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;display:inline-block;width:max-content}
.stk.ok{background:var(--ok-soft);color:var(--ok)} .stk.low{background:var(--warn-soft);color:var(--warn)} .stk.out{background:var(--bad-soft);color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Cart as a struk */
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 100px);overflow:hidden}
.cart-head{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line)}
.cart-head h2{font-family:var(--f-display);font-size:19px;margin:0}
.tier{padding:10px 16px 6px;display:flex;flex-direction:column;gap:8px;border-bottom:1px dashed var(--line)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);padding:3px;border-radius:999px}
.seg2 button{border:0;background:none;padding:7px 6px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;font-size:13px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg2 button[data-tier="pelanggan"][aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row.save .k,.row.save .v{color:var(--ok);font-weight:600}
.prod .pp{font-size:12px;font-weight:600;color:var(--accent)}
.prod .pg{font-size:12px;font-weight:600;color:var(--ok)}
.hint.up{color:var(--ok);font-weight:600;margin-top:2px}
.gtiers{display:flex;flex-direction:column;gap:6px}
.gtiers:empty{display:none}
.gtrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto minmax(0,1.4fr) auto;gap:6px;align-items:center}
.gtrow .hint{white-space:nowrap}
td.gcell{white-space:nowrap;font-size:13px}
.modal>*{flex-shrink:0}
.field label.btn{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.gtrow label{text-transform:none;letter-spacing:0;font-weight:400;font-size:13px}
.prod .pimg.ph{display:grid;place-items:center;font-size:34px}
.prod .pp.alt{color:var(--muted);text-decoration:line-through;font-weight:500}
.cart-items{overflow:auto;padding:6px 16px;flex:1;min-height:80px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .nm{font-weight:600;overflow-wrap:anywhere}
.line .sub{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.line .tot{font-family:var(--f-mono);font-weight:600;text-align:right}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
.switch input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.pricebtn{background:none;border:0;padding:2px 0;margin:0;font-family:var(--f-mono);font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.pricebtn s{opacity:.7}
.pricebtn .edit{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--accent);margin-left:4px}
.pricebtn:hover .edit{text-decoration:underline}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.qty{display:flex;align-items:center;gap:2px;justify-self:end}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:700;line-height:1}
.qty input{width:58px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 0;background:var(--surface)}
.cart-foot{padding:12px 16px 16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .k{color:var(--muted)}
.row .v{font-family:var(--f-mono)}
.grand{font-family:var(--f-display);font-size:26px;font-weight:700}
.grand .v{font-family:var(--f-mono);font-size:24px}
.disc{width:130px;text-align:right}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.methods button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;font-weight:600;cursor:pointer;font-size:13px}
.methods button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1 1 auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--f-mono)}
.change{font-family:var(--f-mono);font-weight:600}
.change.neg{color:var(--bad)} .change.pos{color:var(--ok)}
.pay{padding:12px;font-size:16px}

/* Mobile cart bar */
.mbar{display:none}
@media (max-width:880px){
  .pos{grid-template-columns:minmax(0,1fr)}
  .cart{position:static;max-height:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;justify-content:space-between;align-items:center;gap:10px;
    background:var(--ink);color:var(--bg);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border:0;font-weight:600;cursor:pointer;width:100%}
  .mbar[hidden]{display:none!important}
}

/* Summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-mono);font-size:20px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.tile.warn .v{color:var(--warn)}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sku{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.actions{display:flex;gap:6px;justify-content:flex-end}
tr.void td{color:var(--muted);text-decoration:line-through}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--sunk)}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);text-decoration:none;display:inline-block}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
h2.sec{font-family:var(--f-display);font-size:22px;margin:0}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-family:var(--f-display);font-size:21px;margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mfoot .left{margin-right:auto}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.struk{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;white-space:pre;overflow-x:auto;margin:0}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.hint{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header>

  </nav>
  <div class="who" id="who" hidden><button class="prbtn" id="printerBtn" title="Printer" aria-label="Pengaturan printer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg><i></i></button><button class="userchip" id="userBtn" title="Akun saya"></button><button class="btn sm" data-act="logout">Keluar</button></div>
  <div class="mode" id="mode"><i></i><span>Memuat…</span></div>
</header>

<main id="main"></main>
<button class="mbar" id="mbar" hidden></button>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, initializeAuth, inMemoryPersistence, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, query, where, orderBy, limit, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID");
const rpShort=n=>Math.round(n||0).toLocaleString("id-ID");
const int=v=>{const n=parseInt(String(v).replace(/[^\d-]/g,""),10);return isNaN(n)?0:n};
const qnum=v=>{let t=String(v??"").trim().replace(/\s/g,"");if(!t)return 0;if(t.includes(","))t=t.replace(/\./g,"").replace(",",".");const n=parseFloat(t);return isNaN(n)?0:Math.round(n*1000)/1000};
const r3=n=>Math.round((n||0)*1000)/1000;
const fq=n=>r3(n).toLocaleString("id-ID",{maximumFractionDigits:3});
const fqi=n=>String(r3(n)).replace(".",",");
const su=x=>x&&x!=="pcs"?" "+x:"";
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const initials=n=>String(n||"?").replace(/^contoh:\s*/i,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const thumb=(p,cls)=>p&&p.foto?`<img class="${cls}" src="${esc(p.foto)}" alt="" loading="lazy">`:`<span class="${cls} ph" style="--h:${hue(p&&p.nama)}" aria-hidden="true">${esc(initials(p&&p.nama))}</span>`;
let photoEdit=null,assetsP=null;
function getAssets(){if(!B||B.mode!=="db")return Promise.resolve(null);
  if(!assetsP)assetsP=(window.claude&&window.claude.use?window.claude.use("assets"):Promise.resolve(null)).catch(()=>null);return assetsP;}
async function shrink(file){const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const draw=M=>{const sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c;};
    const big=draw(640);const blob=await new Promise(r=>big.toBlob(r,"image/jpeg",0.82));const dataUrl=draw(360).toDataURL("image/jpeg",0.7);
    return{blob,dataUrl};}finally{URL.revokeObjectURL(url)}}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>{d=new Date(d);return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")};

const S={authKnown:false,authUser:null,setupKnown:false,setupDone:false,products:new Map(),trx:[],exp:[],users:new Map(),usersLoaded:false,me:null,loginPick:null,pinBuf:"",loginErr:"",userFilter:"all",cart:new Map(),tab:"kasir",cat:"Semua",q:"",disc:0,method:"Tunai",paid:"",tier:"umum",custName:"",
  toko:{nama:"Toko Saya",alamat:"",catatan:"Terima kasih atas kunjungan Anda",ppnAktif:false,ppnRate:11,ppnMode:"tambah"},loaded:false,
  stockQ:"",stockLow:false,range:"today",histView:"day",recapSort:"omzet"};

/* ---------- Firebase ---------- */
let B=null,FB=null,dataUnsubs=[],meUnsub=null,dataRole=null;
const authUid=()=>FB&&FB.auth.currentUser?FB.auth.currentUser.uid:null;
function onErr(e){console.error(e);if(e&&e.code==="permission-denied")return;if(e&&e.code==="failed-precondition"){toast("Database perlu indeks. Ikuti langkah 'indeks' di PANDUAN, lalu muat ulang.");return;}toast("Gagal memuat data: "+(e&&e.message||"coba muat ulang"));}
function writeErrAsync(e){console.error(e);if(e&&e.code==="permission-denied")toast("Ditolak server: akun Anda tidak punya izin untuk perubahan ini.");else toast("Gagal menyimpan ke server: "+(e&&e.message||"periksa koneksi"));}
/* Tulisan ke Firestore langsung tersimpan di perangkat dan dikirim saat online, jadi tidak ditunggu. */
const fire=p=>{p.catch(writeErrAsync);return Promise.resolve();};
function firebaseBackend(){
  const db=FB.db;
  const P=collection(db,"produk"),T=collection(db,"transaksi"),E=collection(db,"pengeluaran"),U=collection(db,"pengguna");
  const C=doc(db,"pengaturan","toko"),SETUP=doc(db,"pengaturan","setup");
  const rows=s=>s.docs.map(d=>Object.assign({id:d.id},d.data()));
  return{mode:"firebase",
    startPublic(){
      onSnapshot(C,s=>{if(s.exists())S.toko=Object.assign({},S.toko,s.data());renderHeader();if(!S.me)render();},()=>{});
      onSnapshot(SETUP,s=>{S.setupDone=s.exists();S.setupKnown=true;if(!S.me)render();},()=>{S.setupKnown=true;S.setupDone=true;render();});
    },
    startData(){this.stopData();const uid=authUid();const adm=isAdmin();dataRole=(adm?"a":"k")+uid;
      dataUnsubs.push(onSnapshot(P,s=>{S.products=new Map(rows(s).map(r=>[r.id,r]));S.loaded=true;render();},onErr));
      dataUnsubs.push(onSnapshot(adm?query(T,orderBy("waktu","desc"),limit(3000)):query(T,where("kasirId","==",uid),orderBy("waktu","desc"),limit(1000)),s=>{S.trx=rows(s);render();},onErr));
      dataUnsubs.push(onSnapshot(adm?query(E,orderBy("waktu","desc"),limit(3000)):query(E,where("olehId","==",uid),orderBy("waktu","desc"),limit(1000)),s=>{S.exp=rows(s);render();},onErr));
      dataUnsubs.push(onSnapshot(U,s=>{S.users=new Map(rows(s).map(r=>[r.id,r]));S.usersLoaded=true;render();},onErr));
    },
    stopData(){dataUnsubs.forEach(f=>{try{f()}catch(e){}});dataUnsubs=[];dataRole=null;S.loaded=false;S.products=new Map();S.trx=[];S.exp=[];S.users=new Map();S.usersLoaded=false;},
    setProduct:(id,d)=>fire(setDoc(doc(P,id),d)), updateProduct:(id,d)=>fire(updateDoc(doc(P,id),d)), delProduct:id=>fire(deleteDoc(doc(P,id))),
    adjustStock:(id,delta,extra)=>fire(updateDoc(doc(P,id),Object.assign({stok:increment(r3(delta))},extra||{}))),
    setTrx:(id,d)=>fire(setDoc(doc(T,id),d)), updateTrx:(id,d)=>fire(updateDoc(doc(T,id),d)),
    setToko:d=>fire(setDoc(C,d,{merge:true})),
    setExp:(id,d)=>fire(setDoc(doc(E,id),d)), delExp:id=>fire(deleteDoc(doc(E,id))),
    setUser:(id,d)=>setDoc(doc(U,id),d), updateUser:(id,d)=>fire(updateDoc(doc(U,id),d)), delUser:id=>fire(deleteDoc(doc(U,id))),
    watchMe(uid,cb){if(meUnsub)meUnsub();meUnsub=onSnapshot(doc(U,uid),s=>cb(s.exists()?Object.assign({id:uid},s.data()):null),e=>{console.error(e);cb(null);});},
    unwatchMe(){if(meUnsub){meUnsub();meUnsub=null;}},
    async bootstrapAdmin(uid,data){const b=writeBatch(db);b.set(doc(U,uid),data);b.set(SETUP,{admin:uid,dibuat:new Date().toISOString()});await b.commit();},
    async importAll(data,onProgress){const ops=[];
      Object.entries(data.produk||{}).forEach(([id,d])=>ops.push([doc(P,id),d]));
      Object.entries(data.transaksi||{}).forEach(([id,d])=>ops.push([doc(T,id),d]));
      Object.entries(data.pengeluaran||{}).forEach(([id,d])=>ops.push([doc(E,id),d]));
      const toko=(data.pengaturan||{}).toko;if(toko)ops.push([C,toko,true]);
      for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(([r,d,m])=>m?b.set(r,d,{merge:true}):b.set(r,d));await b.commit();onProgress&&onProgress(Math.min(ops.length,i+400),ops.length);}
      return ops.length;}};
}
function configMissing(){return !firebaseConfig||!firebaseConfig.apiKey||/GANTI|ISI_/.test(JSON.stringify(firebaseConfig));}
async function init(){
  renderHeader();render();
  if(configMissing()){S.configMissing=true;render();return;}
  try{
    const app=initializeApp(firebaseConfig);
    let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}catch(e){db=getFirestore(app);}
    FB={app,db,auth:getAuth(app)};
  }catch(e){console.error(e);S.initError=String(e&&e.message||e);render();return;}
  B=firebaseBackend();B.startPublic();
  onAuthStateChanged(FB.auth,user=>{S.authKnown=true;S.authUser=user;
    if(!user){B.unwatchMe();B.stopData();S.me=null;S.noAccess=false;syncMe();renderHeader();render();return;}
    B.watchMe(user.uid,me=>{
      if(!me||me.aktif===false){S.me=null;S.noAccess=true;B.stopData();syncMe();renderHeader();render();return;}
      const first=!S.me;S.me=me;S.noAccess=false;syncMe();
      if(dataRole!==(isAdmin()?"a":"k")+user.uid)B.startData();
      if(first){S.tab="kasir";S.histView=isAdmin()?"day":"kas";S.userFilter="all";}
      renderHeader();render();});
  });
  const net=()=>renderHeader();window.addEventListener("online",net);window.addEventListener("offline",net);
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
}
function writeErr(e){writeErrAsync(e);throw e;}

/* ---------- Helpers ---------- */
const prods=()=>[...S.products.values()].sort((a,b)=>String(a.nama).localeCompare(String(b.nama),"id"));
const cats=()=>[...new Set(prods().map(p=>p.kategori||"Lainnya"))].sort();
function stockState(p){const s=p.stok||0;if(s<=0)return"out";if(s<=(p.min||0))return"low";return"ok";}
function stockBadge(p,left){const s=left??p.stok??0;const st=s<=0?"out":(s<=(p.min||0)?"low":"ok");
  return `<span class="stk ${st}">${s<=0?"Habis":(st==="low"?"Sisa ":"Stok ")+fq(s)+esc(su(p.satuan))}</span>`;}
function grosirOf(p){return Array.isArray(p&&p.grosir)?p.grosir.filter(t=>t&&t.min>0&&t.harga>0).slice().sort((a,b)=>a.min-b.min):[]}
function qtyTier(p,q){let hit=null;for(const t of grosirOf(p))if(q>=t.min-1e-9)hit=t;return hit;}
function gLabel(p){const g=grosirOf(p);return g.length?"Grosir ≥"+fq(g[0].min)+": "+rpShort(g[0].harga)+(g.length>1?" (+"+(g.length-1)+")":""):"";}
const tierPrice=p=>S.tier==="pelanggan"&&p.hargaPelanggan>0?p.hargaPelanggan:p.harga;
function cartLines(){const out=[];for(const [key,l] of S.cart){
    if(l.custom){out.push({key,id:null,nama:l.nama,harga:l.harga,base:l.harga,umum:l.harga,modal:l.modal||0,qty:l.qty,custom:true,stok:Infinity,satuan:l.satuan||""});continue;}
    const p=S.products.get(key);if(!p)continue;const pb=tierPrice(p);const qt=qtyTier(p,l.qty);const tb=qt&&qt.harga<pb?qt.harga:pb;const h=l.harga!=null?l.harga:tb;
    const nx=grosirOf(p).find(t=>t.min>l.qty+1e-9&&t.harga<tb&&t.min<=(p.stok||0)+1e-9)||null;
    out.push({key,id:key,nama:p.nama,harga:h,base:tb,umum:p.harga,grosir:qt&&qt.harga<pb?qt.min:0,next:nx,modal:p.modal||0,qty:l.qty,custom:false,stok:p.stok||0,satuan:p.satuan||""});}
  return out;}
function cartTotals(){let sub=0,modal=0,items=0;const cls=cartLines();for(const l of cls){sub+=Math.round(l.harga*l.qty);modal+=l.modal*l.qty;}items=cls.length;
  const disc=Math.min(Math.max(0,S.disc||0),sub);const dpp0=sub-disc;
  const on=!!S.toko.ppnAktif;const rate=Number(S.toko.ppnRate)||11;const mode=S.toko.ppnMode==="termasuk"?"termasuk":"tambah";
  let ppn=0,total=dpp0,dpp=dpp0;
  if(on){if(mode==="tambah"){ppn=Math.round(dpp0*rate/100);total=dpp0+ppn;}else{ppn=Math.round(dpp0*rate/(100+rate));dpp=dpp0-ppn;}}
  const hemat=cls.reduce((a,l)=>a+(l.custom||l.harga!==l.base?0:Math.max(0,Math.round((l.umum-l.harga)*l.qty))),0);
  const anyG=cls.some(l=>l.grosir&&l.harga===l.base);const hematLabel=anyG&&S.tier==="pelanggan"?"Hemat grosir & pelanggan":anyG?"Hemat harga grosir":"Hemat harga pelanggan";
  return{sub,disc,total,modal,items,ppn,dpp,rate,mode,on,hemat,hematLabel};}
function toast(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2800);}

/* ---------- Header ---------- */
function renderHeader(){
  {const pb=$("#printerBtn");if(pb){const st=prStatus();pb.dataset.st=PR.mode==="ble"?st:"x";pb.title=PR.mode==="ble"?(btConnected()?"Printer: "+PR.nama:"Printer Bluetooth belum tersambung"):PR.mode==="rawbt"?"Printer lewat RawBT":"Printer: dialog print";}}
  const nav=$("nav.tabs");if(nav)nav.hidden=!S.me;const who=$("#who");who.hidden=!S.me;
  if(S.me)$("#userBtn").innerHTML=avatar(S.me)+`<span>${esc(S.me.nama)}</span><span class="r">${roleName(S.me.peran)}</span>`;
  $("#storeBtn").textContent=S.toko.nama||"Toko Saya";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const m=$("#mode");m.className="mode "+(B?B.mode:"");
  const on=navigator.onLine!==false;m.className="mode "+(on?"db":"local");m.querySelector("span").textContent=!B?"Memuat…":(on?"Online":"Offline · disimpan di perangkat");m.title=on?"Data tersinkron ke server":"Transaksi tetap bisa dicatat dan akan dikirim otomatis saat internet kembali";
}

/* ---------- Render ---------- */
function render(){
  const main=$("#main");
  const active=document.activeElement;const aid=active&&active.id;const sel=active&&active.selectionStart;
  if(!S.me){main.innerHTML=viewLogin();renderMbar();if(aid){const el=document.getElementById(aid);if(el)el.focus();}return;}
  if(!S.loaded){main.innerHTML=`<div class="empty"><strong>Memuat data toko…</strong>Produk dan transaksi sedang diambil.</div>`;return;}
  let banner=B&&B.mode==="local"?`<div class="banner">Mode lokal: data hanya tersimpan di browser ini. Produk berlabel "Contoh" boleh diedit atau dihapus.</div>`:"";
  if(S.tab==="kasir")main.innerHTML=banner+viewKasir();
  else if(S.tab==="stok")main.innerHTML=banner+viewStok();

function dkey(d){d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysBack(n){const t=new Date();return dkey(new Date(t.getFullYear(),t.getMonth(),t.getDate()-n))}
function inRange(t){return inRangeK(dkey(t.waktu))}
function inRangeK(k){
  if(S.range==="today")return k===daysBack(0);
  if(S.range==="7")return k>=daysBack(6);
  if(S.range==="30")return k>=daysBack(29);
  if(S.range==="custom")return (!S.from||k>=S.from)&&(!S.to||k<=S.to);
  return true;}
const fDay=k=>new Date(k+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
const fDayLong=k=>new Date(k+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function rangeLabel(){
  if(S.range==="today")return "Hari ini, "+fDay(daysBack(0));
  if(S.range==="7")return fDay(daysBack(6))+" – "+fDay(daysBack(0));
  if(S.range==="30")return fDay(daysBack(29))+" – "+fDay(daysBack(0));
  if(S.range==="custom"){if(S.from&&S.to&&S.from===S.to)return fDayLong(S.from);
    return (S.from?fDay(S.from):"Awal")+" – "+(S.to?fDay(S.to):"Sekarang");}
  return "Semua transaksi";}
function rangeFile(){if(S.range==="custom")return (S.from||"awal")+(S.to&&S.to!==S.from?"_sd_"+S.to:"");
  if(S.range==="today")return daysBack(0);if(S.range==="7")return daysBack(6)+"_sd_"+daysBack(0);if(S.range==="30")return daysBack(29)+"_sd_"+daysBack(0);return "semua_sd_"+daysBack(0);}
const trxModalCost=t=>Math.round((t.items||[]).reduce((a,i)=>a+(i.modal||0)*i.qty,0));
function buildRecap(ok){const rec=new Map();
  ok.forEach(t=>(t.items||[]).forEach(i=>{const cust=!!(i.custom||!i.id);const k=cust?"c:"+String(i.nama).toLowerCase():i.id;
    let r=rec.get(k);if(!r){r={key:k,nama:i.nama,satuan:i.satuan||"",custom:cust,qty:0,omzet:0,modal:0,trx:new Set(),khusus:0};rec.set(k,r);}
    r.qty=r3(r.qty+i.qty);r.omzet+=Math.round(i.harga*i.qty);r.modal+=Math.round((i.modal||0)*i.qty);r.trx.add(t.id);
    if(i.hargaNormal!=null&&i.harga!==i.hargaNormal)r.khusus++;}));
  const rows=[...rec.values()].map(r=>{const p=r.custom?null:S.products.get(r.key);
    return Object.assign(r,{nama:p?p.nama:r.nama,satuan:p?(p.satuan||""):r.satuan,p,laba:r.omzet-r.modal,nTrx:r.trx.size});});
  const key=S.recapSort==="qty"?"qty":(S.recapSort==="laba"?"laba":"omzet");
  rows.sort((a,b)=>b[key]-a[key]||String(a.nama).localeCompare(String(b.nama),"id"));return rows;}
function buildDaily(list,exps){const m=new Map();
  const get=k=>{let r=m.get(k);if(!r){r={k,trx:0,batal:0,omzet:0,diskon:0,ppn:0,modal:0,laba:0,exp:0,expOps:0};m.set(k,r);}return r;};
  list.forEach(t=>{const r=get(dkey(t.waktu));
    if(t.status==="batal"){r.batal++;return;}const md=trxModalCost(t);
    r.trx++;r.omzet+=t.total||0;r.diskon+=t.diskon||0;r.ppn+=t.ppn||0;r.modal+=md;r.laba+=(t.total||0)-(t.ppn||0)-md;});
  (exps||[]).forEach(e=>{const r=get(expDay(e));r.exp+=e.jumlah||0;if(e.kategori!=="Belanja stok")r.expOps+=e.jumlah||0;});
  return [...m.values()].sort((a,b)=>a.k<b.k?1:-1);}
function summary(list){const ok=list.filter(t=>t.status!=="batal");
  return{ok,batal:list.length-ok.length,omzet:ok.reduce((s,t)=>s+(t.total||0),0),ppn:ok.reduce((s,t)=>s+(t.ppn||0),0),
    disc:ok.reduce((s,t)=>s+(t.diskon||0),0),laba:ok.reduce((s,t)=>s+(t.total||0)-(t.ppn||0)-trxModalCost(t),0)};}

function kasData(ok,exps){const sb=new Map();ok.forEach(t=>{const m=t.metode||"Tunai";sb.set(m,(sb.get(m)||0)+(t.total||0));});
  const eb=new Map();exps.forEach(e=>{const k=e.kategori||"Lainnya";eb.set(k,(eb.get(k)||0)+(e.jumlah||0));});
  const salesTot=ok.reduce((s,t)=>s+(t.total||0),0),expTot=exps.reduce((s,e)=>s+(e.jumlah||0),0);
  const cashIn=sb.get("Tunai")||0;const cashOut=exps.filter(e=>(e.metode||"Tunai")==="Tunai").reduce((s,e)=>s+(e.jumlah||0),0);
  const awal=S.kasAwal||0;
  return{salesTot,expTot,salesBy:[...sb].sort((a,b)=>b[1]-a[1]),expByCat:[...eb].sort((a,b)=>b[1]-a[1]),cashIn,cashOut,awal,laci:awal+cashIn-cashOut,bank:(salesTot-cashIn)-(expTot-cashOut)};}

    "*Pengeluaran: "+rp(k.expTot)+"* ("+exps.length+" catatan)",...exps.map(e=>"  • "+(e.keterangan||e.pemasok||e.kategori)+(e.items&&e.items.length&&!e.keterangan?" ("+e.items.length+" barang)":"")+": "+rp(e.jumlah)+(e.metode&&e.metode!=="Tunai"?" ["+e.metode+"]":"")),"",

    ...(k.awal?["Uang awal di laci: "+rp(k.awal)]:[]),

  const center=s=>{s=String(s).slice(0,W);const p=Math.floor((W-s.length)/2);return " ".repeat(Math.max(0,p))+s};
  const hr="-".repeat(W);const d=new Date(t.waktu);const L=[];
  L.push(center(S.toko.nama||"Toko Saya"));if(S.toko.alamat)L.push(center(S.toko.alamat));
  L.push(hr);L.push(pad(t.no,""));if(t.tier==="pelanggan")L.push(pad(("Pelanggan"+(t.pelanggan?": "+t.pelanggan:"")).slice(0,W),""));if(t.kasirNama)L.push(pad("Kasir: "+t.kasirNama,""));L.push(pad(d.toLocaleDateString("id-ID"),d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})));L.push(hr);
  (t.items||[]).forEach(i=>{L.push(i.grosir?String(i.nama).slice(0,W-9)+" (grosir)":String(i.nama).slice(0,W));L.push(pad("  "+fq(i.qty)+su(i.satuan)+" x "+rpShort(i.harga),rpShort(Math.round(i.qty*i.harga))))});
  L.push(hr);L.push(pad("Subtotal",rpShort(t.subtotal)));if(t.diskon)L.push(pad("Diskon","-"+rpShort(t.diskon)));
  if(t.ppn){const lbl="PPN "+String(t.ppnRate).replace(".",",")+"%";L.push(pad("DPP",rpShort(t.dpp)));L.push(pad(t.ppnMode==="termasuk"?lbl+" (termasuk)":lbl,rpShort(t.ppn)));}
  L.push(pad("TOTAL",rp(t.total)));L.push(pad(t.metode,rpShort(t.bayar)));if(t.metode==="Tunai")L.push(pad("Kembali",rpShort(t.kembali)));
  {const hm=(t.items||[]).reduce((a,i)=>a+(i.hargaUmum>i.harga?Math.round((i.hargaUmum-i.harga)*i.qty):0),0);if(hm>0)L.push(pad("Anda hemat",rpShort(hm)));}
  if(t.status==="batal"){L.push(hr);L.push(center("*** DIBATALKAN ***"));}
  L.push(hr);if(S.toko.catatan)L.push(center(S.toko.catatan));
  return L.join("\n");
}

async function checkout(){
  const t=cartTotals();if(!t.items)return;
  const cl=cartLines();
  for(const l of cl){if(!l.custom&&l.stok<l.qty){toast("Stok "+l.nama+" berubah, periksa keranjang.");return;}}
  const now=new Date();const today=ymd(now);
  const no="INV-"+today+"-"+String(now.getHours()).padStart(2,"0")+String(now.getMinutes()).padStart(2,"0")+String(now.getSeconds()).padStart(2,"0")+"-"+(S.me&&S.me.nama?String(S.me.nama).replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase():"KS");
  const tunai=S.method==="Tunai";const bayar=tunai?int(S.paid):t.total;
  const items=cl.map(l=>({id:l.id,nama:l.nama,harga:l.harga,hargaNormal:l.base,hargaUmum:l.umum,grosir:l.harga===l.base&&l.grosir?l.grosir:0,modal:l.modal,qty:l.qty,satuan:l.satuan,custom:l.custom}));
  const trx={no,waktu:now.toISOString(),items,tier:S.tier==="pelanggan"?"pelanggan":"umum",pelanggan:S.tier==="pelanggan"?String(S.custName||"").trim():"",subtotal:t.sub,diskon:t.disc,dpp:t.dpp,ppn:t.ppn,ppnRate:t.on?t.rate:0,ppnMode:t.on?t.mode:"",total:t.total,metode:S.method,bayar,kembali:tunai?bayar-t.total:0,status:"selesai",kasirId:S.me?S.me.id:"",kasirNama:S.me?S.me.nama:""};
  const tid=uid("t");
  const btn=document.querySelector('[data-act="checkout"]');if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}
  try{
    for(const i of items){if(i.custom)continue;await B.adjustStock(i.id,-i.qty);}
    await B.setTrx(tid,trx);
  }catch(e){try{writeErr(e)}catch(_){}render();return;}
  trxModal.last=Object.assign({id:tid},trx);S.tier="umum";S.custName="";
  S.cart.clear();S.disc=0;S.paid="";S.method="Tunai";render();trxModal(tid,true);
  if(PR.auto)printLines(receiptText(trxModal.last,paperChars()),"Struk-"+trx.no+".pdf","printStrukBtn");
}
async function voidTrx(id){const t=S.trx.find(x=>x.id===id);if(!t||t.status==="batal")return;
  try{for(const i of t.items||[]){if(i.custom||!i.id)continue;if(S.products.get(i.id))await B.adjustStock(i.id,i.qty);}
    await B.updateTrx(id,{status:"batal"});toast("Transaksi "+t.no+" dibatalkan, stok dikembalikan.");closeModal();}catch(e){try{writeErr(e)}catch(_){}}}

document.addEventListener("click",async e=>{
  const el=e.target.closest("button,[data-trx],[data-day],[data-exp],[data-scrim]");if(!el)return;
  if(el.matches("[data-scrim]")){if(e.target===el)closeModal();return;}
  const d=el.dataset;
  if(d.tab){S.tab=d.tab;renderHeader();render();window.scrollTo(0,0);return;}
  if(d.pick){S.loginPick=d.pick;S.pinBuf="";S.loginErr="";S.shake=false;render();return;}
  if(d.pin){pinPush(d.pin);return;}
  if(d.uid){userEditModal(d.uid);return;}
  if(d.add){addToCart(d.add);return;}
  if(d.inc){addToCart(d.inc);return;}
  if(d.dec){setQty(d.dec,((S.cart.get(d.dec)||{}).qty||0)-1);return;}
  if(d.price){priceModal(d.price);return;}
  if(d.rm){S.cart.delete(d.rm);render();return;}
  if(d.cat){S.cat=d.cat;render();return;}
  if(d.method){S.method=d.method;render();return;}
  if(d.tier){S.tier=d.tier;if(d.tier==="umum")S.custName="";render();if(d.tier==="pelanggan"){const c=$("#custName");if(c)c.focus();}return;}
  if(d.quick){S.paid=String(d.quick);render();return;}
  if(d.range){S.range=d.range;if(d.range==="custom"&&!S.from&&!S.to){S.from=S.to=daysBack(0);}render();return;}
  if(d.day){S.range="custom";S.from=S.to=d.day;S.histView="item";render();window.scrollTo(0,0);return;}
  if(d.quickday){S.from=S.to=daysBack(+d.quickday);render();return;}
  if(d.quickmonth){const t=new Date();const off=d.quickmonth==="1"?0:-1;const a=new Date(t.getFullYear(),t.getMonth()+off,1);const b=off===0?t:new Date(t.getFullYear(),t.getMonth(),0);S.from=dkey(a);S.to=dkey(b);render();return;}
  if(d.hview){S.histView=d.hview;render();return;}
  if(d.rsort){S.recapSort=d.rsort;render();return;}
  if(d.edit){productModal(d.edit);return;}
  if(d.restock){restockModal(d.restock);return;}
  if(d.exp){expModal(d.exp);return;}
  if(d.trx){trxModal(d.trx);return;}
  if(el.id==="storeBtn"){if(!S.me)return;if(!isAdmin()){toast("Hanya admin yang bisa mengubah pengaturan toko.");return;}storeModal();return;}
  if(el.id==="userBtn"){accountModal();return;}
  if(el.id==="printerBtn"){printerModal();return;}
  if(el.id==="mbar"){$("#cart").scrollIntoView({behavior:"smooth"});return;}
  switch(d.act){
    case"checkout":checkout();break;
    case"clearCart":S.cart.clear();S.disc=0;S.paid="";render();break;
    case"newProduct":productModal();break;
    case"customItem":customModal();break;
    case"addTier":{const box=$("#gtiers");if(box){box.insertAdjacentHTML("beforeend",gtRow(0,null,$("#f-sat")?$("#f-sat").value:"pcs"));const ins=box.querySelectorAll(".gt-min");ins[ins.length-1].focus();}break;}
    case"rmTier":{const r=el.closest(".gtrow");if(r)r.remove();break;}
    case"exportPdf":exportPdf();break;
    case"newExp":expModal();break;
    case"pinDel":pinDel();break;
    case"pinGo":pinGo();break;
    case"pickBack":S.loginPick=null;S.pinBuf="";S.loginErr="";render();break;
    case"forgotPin":forgotPin();break;
    case"logout":askLogout();break;
    case"doLogout":doLogout();break;
    case"users":if(S.tab==="pengguna")closeModal();else if(isAdmin())usersModal();break;
    case"goUsers":closeModal();S.tab="pengguna";renderHeader();render();window.scrollTo(0,0);break;
    case"printStruk":{const t=S.trx.find(x=>x.id===d.id)||trxModal.last;if(t)printLines(receiptText(t,paperChars()),"Struk-"+t.no+".pdf","printStrukBtn");break;}
    case"printKas":printLines(kasLines(paperChars()),"Laporan-Kas-"+rangeFile()+".pdf","printKasBtn");break;
    case"printExp":{const e=S.exp.find(x=>x.id===$("#eform").dataset.id);if(e)printLines(expLines(e,paperChars()),"Nota-Pengeluaran-"+expDay(e)+".pdf","printExpBtn");break;}
    case"exportStock":exportStockPdf();break;
    case"btConnect":{const b=$("#btConnectBtn");if(b){b.disabled=true;b.textContent="Mencari…";}
      try{await btPick();toast("Printer "+PR.nama+" tersambung.");}catch(er){if(!(er&&er.name==="NotFoundError"))toast(er&&er.message?er.message:"Gagal menyambung printer.");refreshPrinterModal();}break;}
    case"btDisconnect":try{btDev&&btDev.gatt&&btDev.gatt.disconnect();}catch(er){}btChar=null;renderHeader();refreshPrinterModal();break;
    case"testPrint":printLines(testText(),"Tes-printer.pdf","testPrintBtn");break;
    case"forgotPass":{const email=($("#li-email")||{}).value;if(!email||!email.trim()){toast("Isi email Anda dulu, lalu ketuk Lupa password.");break;}
      try{await sendPasswordResetEmail(FB.auth,email.trim());toast("Link atur ulang password dikirim ke "+email.trim()+". Cek juga folder spam.");}catch(er){toast(authMsg(er));}break;}
    case"sendReset":try{await sendPasswordResetEmail(FB.auth,d.email);toast("Email atur ulang password dikirim ke "+d.email+".");}catch(er){toast(authMsg(er));}break;

    try{await B.setToko(d);S.toko=d;renderHeader();closeModal();toast("Info toko disimpan.");}catch(er){try{writeErr(er)}catch(_){}}
  }
});

renderHeader();init();
})();
</script>
